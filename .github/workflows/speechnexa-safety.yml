name: SpeechNexa migration safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check migration boundaries
        run: python scripts/check_migration_safety.py
      - name: Install lightweight test dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Check model licensing and generated disclosure
        run: |
          python scripts/check_model_licenses.py
          python scripts/generate_model_license_data.py --check
      - name: Run offline migration and licensing tests
        env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_CACHE: ${{ runner.temp }}/speechnexa-empty-hf-cache
        run: python -m pytest tests/test_migration_workflow_safety.py tests/test_model_licenses.py -q

  electron-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check Electron types and locale contract
        run: |
          bun run --cwd electron typecheck
          bun run --cwd electron locale:check
