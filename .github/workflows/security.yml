# Security scanning — runs on every PR, on push to main, and weekly.
#
# Complements the CodeRabbit + Greptile app reviews (which fire on PR creation)
# with deterministic checks:
#   • gitleaks   — secret scanning. HARD FAIL: a leaked credential fails CI
#                  (not a required check; treat a red run as a merge blocker).
#   • CodeQL     — Python + JS/TS SAST when code scanning is available (public).
#   • bandit     — Python SAST, always retained as a JSON CI artifact.
#   • pip-audit  — Python dependency advisories. Reporting, non-gating.
#   • bun audit  — Electron dependency advisories. Reporting, non-gating.
#
# Only the secret scan and broken scan tooling fail the run. Dependency
# advisories and Bandit findings are reported without blocking every PR.
# Private repositories without GitHub Code Security cannot upload CodeQL or
# SARIF results; the private workflow still preserves Bandit findings.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — catch advisories disclosed since the last PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  # Match ci.yml: run JS actions on Node 24 (GH removes Node 20 in Sep 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege by default; jobs that upload SARIF opt into security-events.
permissions:
  contents: read

# PR branches: a new push cancels the superseded scan (no wasted runners).
# main: every commit keeps its own group, so nothing is cancelled — a merge
# train used to leave a permanent red ✗ ("cancelled") on every intermediate
# commit in the history view even though nothing failed.
concurrency:
  group: security-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Secret scanning (gating) ─────────────────────────────────────────────
  # Full-history scan on push to main; PR-diff scan on pull_request (faster,
  # and the action picks the right mode from the event automatically).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks needs full history to scan all commits on push events.
          fetch-depth: 0
          # No authed git needed after clone; don't persist GITHUB_TOKEN.
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organizations*; this is
          # a personal public repo, so the action runs free without it.

  # ── CodeQL SAST (Python + JS/TS) ─────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    # GitHub's code-scanning API is unavailable on this private repository.
    # Do not run CodeQL CLI without an applicable private-repository license.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # Both targets are interpreted — no compiled build step needed.
          build-mode: none
          # Scope analysis to shipped product code. The excluded trees never
          # ship in the installer's runtime path and produce the bulk of the
          # note-level + false-positive findings (file-not-closed in eval
          # harnesses, bind-all in tests, path sinks in the legacy Gradio
          # research UI). Active backend migrations remain in scope. Queries live in the
          # inline config so there's a single source of truth next to
          # paths-ignore. paths-ignore is supported here because build-mode is
          # `none` (interpreted analysis).
          config: |
            queries:
              - uses: security-and-quality
            paths-ignore:
              - omnivoice/eval
              - research
              - tests
              - "**/*.test.js"
              - "**/*.test.jsx"
              - "**/*.test.ts"
              - "**/*.test.tsx"

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

  # ── Python SAST (Bandit JSON artifact on every run) ──────────────────────
  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # -ll: MEDIUM+ severity. -ii: MEDIUM+ confidence. Bandit exits 1 when it
      # finds issues; keep findings non-gating, but fail for missing/malformed
      # output or a broken scanner. JSON remains available on private repos.
      - name: Run bandit
        run: |
          set +e
          pipx run --spec 'bandit==1.9.4' bandit -r backend/ -ll -ii -f json -o bandit.json
          scan_status=$?
          set -e
          test -s bandit.json
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi
          python3 - <<'PY'
          import json
          import os

          with open('bandit.json', encoding='utf-8') as report:
              findings = json.load(report)['results']
          counts = {level: sum(item['issue_severity'] == level for item in findings)
                    for level in ('HIGH', 'MEDIUM')}
          line = f"Bandit: {len(findings)} findings ({counts['HIGH']} high, {counts['MEDIUM']} medium)"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Python static analysis\n\n' + line + '\n\n')
              summary.write('Download the `bandit-report` artifact for file and line details.\n')
          PY

      - name: Preserve Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: warn

      # Preserve Security-tab reporting if the project is public again.
      - name: Generate Bandit SARIF (public repositories only)
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        run: |
          pipx run --spec 'bandit[sarif]==1.9.4' bandit -r backend/ -ll -ii -f sarif -o bandit.sarif

      - name: Upload Bandit SARIF (public repositories only)
        if: ${{ !github.event.repository.private && hashFiles('bandit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── Dependency advisories (reporting) ────────────────────────────────────
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Audit the resolved Python environment. Non-gating: a transitive
      # advisory with no fix available should not wall off every PR.
      - name: pip-audit (Python)
        continue-on-error: true
        run: |
          bash scripts/uv-sync-retry.sh
          uv run --with pip-audit pip-audit

      # Same bun as package.json packageManager (tests/test_bun_toolchain_pins.py).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      # `bun audit` reports advisories against the root workspace lockfile
      # (bun.lock, which covers Electron). Non-gating for the same reason.
      - name: bun audit (Electron)
        continue-on-error: true
        run: |
          bun install --frozen-lockfile
          bun audit
